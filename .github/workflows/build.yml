name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - name: Name APK by version
        id: v
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "YuanCheck-v$VER.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: YuanCheck-v${{ steps.v.outputs.ver }}
          path: YuanCheck-v${{ steps.v.outputs.ver }}.apk
      - name: Save this version in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: ЮаньЧек ${{ steps.v.outputs.ver }}
          body_path: CHANGELOG.txt
          files: YuanCheck-v${{ steps.v.outputs.ver }}.apk
